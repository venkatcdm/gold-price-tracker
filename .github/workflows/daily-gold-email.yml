
name: Daily India and Chennai 22K Gold Email
on:
  schedule:
    # 09:00 AM IST
    - cron: "30 3 * * *"

  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: daily-gold-email
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch India and Chennai rates, compare, and send email
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python main.py

      - name: Save daily price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json

          if ! git diff --cached --quiet; then
            git commit -m "Update daily gold price history [skip ci]"
            git push
          else
            echo "No history changes to commit."
          fi
